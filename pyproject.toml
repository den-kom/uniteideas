[project]
name = "uniteideas"
version = "0.2.0"
description = "UniteIdeas.org — share ideas safely, prove authorship, collaborate on POCs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.30",
  "itsdangerous>=2.2.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
